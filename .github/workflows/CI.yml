name: CI

on:
  pull_request:
    branches: [master]

env:
  DEFAULT_PYTHON: 3.14

jobs:
  pre-commit:
    runs-on: "ubuntu-latest"
    name: Pre-commit
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v3.1.1
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install Python modules
        run: |
          pip install -r .github/workflows/constraints.txt -r requirements.txt

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure --color=always

  hacs:
    runs-on: "ubuntu-latest"
    name: HACS
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v3"

      - name: HACS validation
        uses: "hacs/action@22.5.0"
        with:
          category: "integration"
          ignore: brands

  hassfest:
    runs-on: "ubuntu-latest"
    name: Hassfest
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v3"

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"

  pytest:
    runs-on: "ubuntu-latest"
    name: Pytest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v3"

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v3.1.1
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Upgrade pip
        run: |
          pip install pip
          pip --version

      - name: Install dependencies
        run: |
          pip install -r .github/workflows/constraints.txt -r requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=custom_components.integration_ecowitt --cov-report=xml --cov-report=term

      - name: Parse coverage percent
        id: coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, os
          r = ET.parse('coverage.xml').getroot()
          p = float(r.attrib.get('line-rate', 0))*100
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"percent={p:.2f}\n")
          PY

      - name: Comment coverage summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const percent = `${{ steps.coverage.outputs.percent }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- coverage-summary -->';
            const body = `${marker}\n### Test Coverage Summary\n\n- Total coverage: ${percent}%\n\nThis report was generated by CI.`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
